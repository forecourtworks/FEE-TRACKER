<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fee Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="no-print">
    <h1>School Fee Tracker</h1>
    <nav>
      <div id="child-tabs" class="tabs"></div>
    </nav>
  </header>

  <main>
    <!-- Entry Form Section -->
    <section id="form-section" class="card no-print">
      <h2 id="form-title">Add / Edit Fee Entry</h2>
      <form id="fee-form">
        <div class="form-group">
          <label for="entry-date">Date:</label>
          <input type="date" id="entry-date" required>
        </div>
        <div class="form-group">
          <label for="entry-desc">Description / Term:</label>
          <input type="text" id="entry-desc" placeholder="e.g. Term 1 Tuition" required>
        </div>
        <div class="form-group">
          <label for="entry-amount">Amount:</label>
          <input type="number" id="entry-amount" step="0.01" placeholder="0.00" required>
        </div>
        <button type="submit" id="form-submit-btn" class="btn-primary">Add Entry</button>
        <button type="button" id="form-cancel-btn" class="btn-secondary" style="display:none;">Cancel Edit</button>
      </form>
    </section>

    <!-- Records Table Section -->
    <section class="card">
      <div class="table-header-action">
        <h2 id="active-child-heading">Fee Records</h2>
        <button onclick="window.print()" class="btn-print no-print">Print / Save as PDF</button>
      </div>
      
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Description</th>
            <th>Amount</th>
            <th class="no-print">Actions</th>
          </tr>
        </thead>
        <tbody id="child-records-body">
          <!-- Records go here -->
        </tbody>
      </table>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
